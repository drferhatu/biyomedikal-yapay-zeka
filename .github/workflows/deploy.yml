name: GitHub Pages'e dağıt

# Her push'ta (Colab'dan "GitHub'a kopya kaydet" dahil) defterler çalıştırılır,
# gömülü HTML görünümleri üretilir, site derlenir ve dist/ gh-pages dalına yazılır.
# Pages kaynağı: gh-pages dalı, kök dizin (Actions tabanlı deploy-pages 2026-11-06'da sorun çıkardığı için değiştirildi).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-notebooks.txt
      - run: pip install -r scripts/requirements-notebooks.txt

      - name: Defterleri çalıştır ve HTML'e çevir
        env:
          # Depo ayarları → Secrets → LLM_API_KEY eklenirse LLM hücreleri gerçek yanıt üretir;
          # yoksa bu hücreler atlanır ve defterdeki mevcut çıktı korunur.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/build_notebooks.py --execute

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: İçerik doğrulaması
        run: python scripts/validate_content.py

      - name: gh-pages dalına yayımla
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Site: ${{ github.sha }}"
